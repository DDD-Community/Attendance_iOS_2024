# VoteFeedbackView 화면. 팀 선택 다음 단계이며 제출은 하지 않는다.
# 팀 선택과 다음 버튼은 로컬 단계 이동이라 서버 상태를 바꾸지 않는다.
# 진행 중인 투표가 없으면 드롭다운에 투표 항목이 없으므로 화면 검증을 건너뛴다.
appId: io.DDD.Attendance
name: 멤버 투표 피드백 화면
tags:
  - e2e
  - member
  - vote
---
# 단독 실행돼도 돌 수 있게 로그인 상태를 먼저 보장한다.
- runFlow:
    file: ../_shared/ensure_member_home.yaml

- extendedWaitUntil:
    visible:
      id: "member.home.root"
    timeout: 30000

- tapOn:
    id: "member.home.sectionbutton"
- extendedWaitUntil:
    visible:
      id: "member.home.dropdown"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "member.home.dropdown.item.vote"
    commands:
      - tapOn:
          id: "member.home.dropdown.item.vote"
      - waitForAnimationToEnd

      - extendedWaitUntil:
          visible:
            id: "member.vote.teamselect.root"
          timeout: 30000
      - tapOn:
          id: "member.vote.teamselect.team.[0-9]+"
          index: 0
      - tapOn:
          id: "member.vote.teamselect.nextbutton"

      - extendedWaitUntil:
          visible:
            id: "member.vote.feedback.root"
          timeout: 30000
      - assertVisible:
          id: "member.vote.feedback.question.*"
      - assertVisible:
          id: "member.vote.feedback.submitbutton"

      - takeScreenshot: .maestro/artifacts/member/vote-feedback

      # 작성 중 이탈은 확인 모달을 띄운다. "나가기"로 빠져나온다.
      - swipe:
          start: "2%, 50%"
          end: "80%, 50%"
      - tapOn:
          text: "나가기"

      - extendedWaitUntil:
          visible:
            id: "member.home.root"
          timeout: 30000
      - runFlow:
          file: ../_shared/switch_section.yaml
          env:
            SECTION_BUTTON_ID: "member.home.sectionbutton"
            SECTION_ITEM_ID: "member.home.dropdown.item.attendance"

- runFlow:
    when:
      notVisible:
        id: "member.home.dropdown.item.vote"
    commands:
      - tapOn:
          id: "member.home.dropdown.item.attendance"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "member.attendance.summary"
    timeout: 30000
