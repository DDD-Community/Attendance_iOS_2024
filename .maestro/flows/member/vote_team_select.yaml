# VoteTeamSelectView 화면. 투표가 진행 중일 때만 뜬다.
# 팀 선택만 확인하고 제출하지 않으며, 종료 시 홈으로 복귀한다.
# 진행 중인 투표가 없으면 드롭다운에 투표 항목이 없으므로 화면 검증을 건너뛴다.
appId: io.DDD.Attendance
name: 멤버 투표 팀 선택 화면
tags:
  - e2e
  - member
  - vote
---
# 단독 실행돼도 돌 수 있게 로그인 상태를 먼저 보장한다.
- runFlow:
    file: ../_shared/ensure_member_home.yaml

- extendedWaitUntil:
    visible:
      id: "member.home.root"
    timeout: 30000

- tapOn:
    id: "member.home.sectionbutton"
- extendedWaitUntil:
    visible:
      id: "member.home.dropdown"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "member.home.dropdown.item.vote"
    commands:
      - tapOn:
          id: "member.home.dropdown.item.vote"
      - waitForAnimationToEnd

      - extendedWaitUntil:
          visible:
            id: "member.vote.teamselect.root"
          timeout: 30000
      - assertVisible:
          id: "member.vote.teamselect.category.*"
      - assertVisible:
          id: "member.vote.teamselect.team.[0-9]+"
      - assertVisible:
          id: "member.vote.teamselect.nextbutton"

      - takeScreenshot: .maestro/artifacts/member/vote-team-select

      # 작성 중 이탈은 확인 모달을 띄운다. "나가기"로 빠져나온다.
      - swipe:
          start: "2%, 50%"
          end: "80%, 50%"
      - tapOn:
          text: "나가기"

      - extendedWaitUntil:
          visible:
            id: "member.home.root"
          timeout: 30000
      - runFlow:
          file: ../_shared/switch_section.yaml
          env:
            SECTION_BUTTON_ID: "member.home.sectionbutton"
            SECTION_ITEM_ID: "member.home.dropdown.item.attendance"

- runFlow:
    when:
      notVisible:
        id: "member.home.dropdown.item.vote"
    commands:
      - tapOn:
          id: "member.home.dropdown.item.attendance"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "member.attendance.summary"
    timeout: 30000
