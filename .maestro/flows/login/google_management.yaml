appId: io.DDD.Attendance
name: Google 운영진 계정 로그인
---
- runFlow:
    file: google.yaml

# suhwj81이 포함된 계정은 운영진 계정이다.
# 제목 대신 탭 대상인 계정 행이 뜨는 것을 기다린다.
- extendedWaitUntil:
    visible: ".*suhwj81.*"
    timeout: 60000
- tapOn:
    text: ".*suhwj81.*"
- tapOn:
    text: "Continue|계속"
    optional: true
