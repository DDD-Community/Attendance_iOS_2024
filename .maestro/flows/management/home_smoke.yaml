appId: io.DDD.Attendance
name: 운영진 홈 주요 콘텐츠
tags:
  - e2e
  - management
---
# 단독 실행돼도 돌 수 있게 로그인 상태를 먼저 보장한다.
- runFlow:
    file: ../_shared/ensure_management_home.yaml

- extendedWaitUntil:
    visible:
      id: "management.staff.root"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "management.attendance.summary"
    timeout: 30000
- assertVisible:
    id: "management.attendance.list"
- assertNotVisible:
    id: "management.staff.skeleton"
- takeScreenshot: .maestro/artifacts/management/home
