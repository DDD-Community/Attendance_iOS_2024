# 운영진 출석 상태 변경 E2E
# 첫 출석 카드(운영진 테스트 계정의 고정 사용자 207)의 상태를 지각으로 바꾼 뒤 출석으로 복구한다.
appId: io.DDD.Attendance
name: 운영진 출석 상태 변경은 카드 목록만 갱신한다
tags:
  - e2e
  - management
  - attendance
---

- extendedWaitUntil:
    visible:
      id: "management.attendance.summary"
    timeout: 30000

- assertVisible:
    id: "management.attendance.summary"
- assertVisible:
    id: "management.attendance.list"
- assertNotVisible:
    id: "management.staff.skeleton"

- tapOn:
    point: "87%,50%"
- assertVisible:
    text: "출석 상태를 변경하시겠습니까?"
- tapOn:
    point: "50%,53%"
- tapOn:
    point: "50%,65%"
- tapOn:
    point: "50%,62%"

- assertVisible:
    id: "management.staff.root"
- assertVisible:
    id: "management.attendance.summary"
- assertNotVisible:
    id: "management.staff.skeleton"

- extendedWaitUntil:
    visible:
      id: "management.attendance.card.*"
    timeout: 30000
- assertNotVisible:
    id: "management.attendance.list.skeleton"
- assertVisible:
    id: "management.attendance.card.207"
    text: "지각"

- tapOn:
    point: "87%,50%"
- tapOn:
    point: "50%,53%"
- tapOn:
    point: "50%,59%"
- tapOn:
    point: "50%,62%"
- extendedWaitUntil:
    visible:
      id: "management.attendance.card.*"
    timeout: 30000
- assertNotVisible:
    id: "management.attendance.list.skeleton"
- assertVisible:
    id: "management.attendance.card.207"
    text: "출석"

- takeScreenshot: .maestro/artifacts/management/attendance-refresh
