name: PR Test Coverage

on:
  pull_request:
    branches: [develop, main]

# 같은 PR 에 새 커밋이 오면 이전 실행은 취소한다(러너가 한 대뿐이라 대기열을 줄인다).
concurrency:
  group: pr-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test-shards:
    name: Build test shards
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      TUIST_BUILD_TAGS: ci,pull-request
      TUIST_BUILD_VALUE_PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        with:
          derived-data-directory: DDDAttendance-pr-build-shards

      # CI 잡마다 캐시 데몬과 소켓을 빌드 전에 보장한다.
      # 인증이나 daemon 기동이 실패해도 테스트 자체는 캐시 없이 계속한다.
      - name: Setup Tuist cache
        id: tuist-cache
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup cache

      - name: Configure compilation cache fallback
        run: |
          if [[ "${{ steps.tuist-cache.outcome }}" == "success" ]]; then
            echo "XCODE_COMPILATION_CACHE_ENABLED=YES" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "XCODE_COMPILATION_CACHE_ENABLED=NO" >> "$GITHUB_ENV"
          echo "Tuist cache를 사용할 수 없어 이번 실행은 Xcode compilation cache 없이 진행합니다."
          CACHE_LOG="$HOME/.local/state/tuist/tuist.cache.DDD2026_attendance.stderr.log"
          if [[ -f "$CACHE_LOG" ]]; then
            tail -n 80 "$CACHE_LOG"
          fi

      # 토큰 권한이 정상일 때만 러너 메트릭 수집을 활성화한다.
      - name: Setup Tuist insights
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup insights

      - name: Install project dependencies
        run: mise exec -- tuist install

      - name: Prepare build DerivedData
        run: |
          mkdir -p "$CI_DERIVED_DATA"
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist" \
            ShardBuildResults.xcresult \
            ShardBuildRunReport.json \
            TuistShardBuild.log

      # Xcode 업데이트 뒤에도 러너에 실제 설치된 최신 iPhone runtime을 사용한다.
      - name: Select simulator
        run: |
          SIMULATOR_DESTINATION="$(python3 Scripts/select-ios-simulator.py)"
          echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"

      # 사용 중인 개발용 기기 대신 유휴 기기를 부팅하고 actool의 CoreSimulator spawn을 미리 검증한다.
      - name: Prepare simulator
        run: ./Scripts/prepare-ios-simulator.sh

      # Tuist가 테스트 산출물을 원격 shard storage에 올리고 matrix JSON을 GITHUB_OUTPUT으로 내보낸다.
      - name: Build and plan test shards
        id: build
        continue-on-error: true
        run: |
          mise exec -- tuist test run DDDAttendance-Stage \
            --build-only \
            --test-plan DDDAttendance \
            --configuration Stage \
            --no-selective-testing \
            --shard-total 2 \
            --shard-granularity suite \
            --inspect-mode remote \
            --result-bundle-path ShardBuildResults.xcresult \
            --run-report-path ShardBuildRunReport.json \
            --path "$PWD" \
            -- \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -enableCodeCoverage YES \
            -collect-test-diagnostics never \
            ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED" \
            2>&1 | tee TuistShardBuild.log

      # tuist test 실패 시 Test Insights만 업로드될 수 있으므로, 남은 xcactivitylog를
      # 명시적으로 분석해 Builds 표에도 실패한 Stage 빌드를 기록한다.
      - name: Report failed build to Tuist
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        run: |
          mise exec -- tuist inspect build \
            --derived-data-path "$CI_DERIVED_DATA"

      - name: Upload shard build reports
        id: upload-shard-build-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-test-build-${{ github.run_id }}
          path: |
            ShardBuildResults.xcresult
            ShardBuildRunReport.json
            TuistShardBuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Retry shard build report upload
        if: always() && steps.upload-shard-build-reports.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-test-build-${{ github.run_id }}-retry-${{ github.run_attempt }}
          path: |
            ShardBuildResults.xcresult
            ShardBuildRunReport.json
            TuistShardBuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Shut down shard build simulator
        if: always()
        run: |
          SIMULATOR_UDID="${SIMULATOR_DESTINATION##*,id=}"
          if [[ -n "$SIMULATOR_UDID" && "$SIMULATOR_UDID" != "$SIMULATOR_DESTINATION" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Clean shard build DerivedData
        if: always()
        run: |
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist" \
            ShardBuildResults.xcresult \
            ShardBuildRunReport.json \
            TuistShardBuild.log

      - name: Fail if shard build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  test-shards:
    name: Test shard ${{ matrix.shard }}
    needs: build-test-shards
    if: needs.build-test-shards.result == 'success' && toJSON(fromJSON(needs.build-test-shards.outputs.matrix).shard) != '[]'
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-test-shards.outputs.matrix) }}

    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      TUIST_BUILD_TAGS: ci,pull-request,sharded
      TUIST_BUILD_VALUE_PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
      TUIST_SHARD_INDEX: ${{ matrix.shard }}
      TUIST_SHARD_PLAN_ID: ${{ matrix.shard_plan_id }}
      RESULT_BUNDLE: TestResults-${{ matrix.shard }}.xcresult
      TEST_RUN_REPORT_PATH: TestRunReport-${{ matrix.shard }}.json
      TEST_LOG_PATH: TuistTestRun-${{ matrix.shard }}.log
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        with:
          derived-data-directory: DDDAttendance-pr-shard-${{ matrix.shard }}

      - name: Select simulator
        run: |
          SIMULATOR_DESTINATION="$(python3 Scripts/select-ios-simulator.py)"
          echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"

      - name: Prepare simulator
        run: ./Scripts/prepare-ios-simulator.sh

      - name: Prepare shard DerivedData
        run: |
          mkdir -p "$CI_DERIVED_DATA"
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist" \
            "$RESULT_BUNDLE" \
            "$TEST_RUN_REPORT_PATH" \
            "$TEST_LOG_PATH"

      - name: Run test shard
        id: tests
        continue-on-error: true
        run: ./Scripts/run-isolated-module-tests.sh

      - name: Upload test shard reports
        id: upload-test-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-test-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            TestResults-${{ matrix.shard }}.xcresult
            TestRunReport-${{ matrix.shard }}.json
            TuistTestRun-${{ matrix.shard }}.log
            TestLogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Retry test shard report upload
        if: always() && steps.upload-test-reports.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-test-shard-${{ github.run_id }}-${{ matrix.shard }}-retry-${{ github.run_attempt }}
          path: |
            TestResults-${{ matrix.shard }}.xcresult
            TestRunReport-${{ matrix.shard }}.json
            TuistTestRun-${{ matrix.shard }}.log
            TestLogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean test shard DerivedData
        if: always()
        run: |
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist" \
            "$RESULT_BUNDLE" \
            "$TEST_RUN_REPORT_PATH" \
            "$TEST_LOG_PATH" \
            TestLogs

      - name: Fail if test shard failed
        if: steps.tests.outcome != 'success'
        run: exit 1

  bundle-insights:
    name: Bundle insights
    needs: test-shards
    if: always() && needs.test-shards.result != 'cancelled'
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      TUIST_BUILD_TAGS: ci,pull-request,bundle
      TUIST_BUILD_VALUE_PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BUILD_RUN_REPORT_PATH: BuildRunReport.json
      BUNDLE_INSPECT_REPORT_PATH: BundleInspectReport.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS runner
        uses: ./.github/actions/setup-ios-runner
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        with:
          derived-data-directory: DDDAttendance-pr-bundle

      - name: Setup Tuist cache
        id: tuist-cache
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup cache

      - name: Configure compilation cache fallback
        run: |
          if [[ "${{ steps.tuist-cache.outcome }}" == "success" ]]; then
            echo "XCODE_COMPILATION_CACHE_ENABLED=YES" >> "$GITHUB_ENV"
          else
            echo "XCODE_COMPILATION_CACHE_ENABLED=NO" >> "$GITHUB_ENV"
            echo "Tuist cache를 사용할 수 없어 bundle build는 Xcode compilation cache 없이 진행합니다."
          fi

      - name: Setup Tuist insights
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup insights

      - name: Generate Xcode workspace
        run: |
          mise exec -- tuist install
          mise exec -- tuist generate --no-open --cache-profile none

      - name: Prepare bundle DerivedData
        run: |
          mkdir -p "$CI_DERIVED_DATA"
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist" \
            BundleBuildResults.xcresult \
            "$BUILD_RUN_REPORT_PATH" \
            "$BUNDLE_INSPECT_REPORT_PATH" \
            DDDAttendance-Stage.ipa

      - name: Build app for bundle insights
        id: app-build
        continue-on-error: true
        run: |
          TUIST_RUN_REPORT_PATH="$BUILD_RUN_REPORT_PATH" \
            mise exec -- tuist xcodebuild build \
            -workspace DDDAttendance.xcworkspace \
            -scheme DDDAttendance-Stage \
            -configuration Stage \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -resultBundlePath BundleBuildResults.xcresult \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED"

          if [[ ! -s "$BUILD_RUN_REPORT_PATH" ]]; then
            echo "Tuist build run이 서버 dashboard URL을 기록하지 못했습니다: $BUILD_RUN_REPORT_PATH" >&2
            exit 1
          fi

      - name: Inspect bundle size
        id: bundle-inspect
        if: steps.app-build.outcome == 'success'
        continue-on-error: true
        run: |
          APP_PATH="$(find "$CI_DERIVED_DATA/Build/Products/Stage-iphoneos" -maxdepth 1 -type d -name DDDAttendance.app -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Stage 디바이스 앱 번들을 찾지 못했습니다." >&2
            exit 1
          fi

          BUNDLE_PAYLOAD="$RUNNER_TEMP/attendance-bundle-payload"
          rm -rf "$BUNDLE_PAYLOAD"
          mkdir -p "$BUNDLE_PAYLOAD/Payload"
          ditto "$APP_PATH" "$BUNDLE_PAYLOAD/Payload/DDDAttendance.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$BUNDLE_PAYLOAD/Payload" \
            DDDAttendance-Stage.ipa

          mise exec -- tuist inspect bundle DDDAttendance-Stage.ipa --json \
            > "$BUNDLE_INSPECT_REPORT_PATH"
          mise exec -- tuist inspect bundle DDDAttendance-Stage.ipa

      - name: Upload bundle reports
        id: upload-bundle-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-bundle-insights-${{ github.run_id }}
          path: |
            BundleBuildResults.xcresult
            BuildRunReport.json
            BundleInspectReport.json
            DDDAttendance-Stage.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Retry bundle report upload
        if: always() && steps.upload-bundle-reports.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-bundle-insights-${{ github.run_id }}-retry-${{ github.run_attempt }}
          path: |
            BundleBuildResults.xcresult
            BuildRunReport.json
            BundleInspectReport.json
            DDDAttendance-Stage.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean bundle DerivedData
        if: always()
        run: |
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist" \
            BundleBuildResults.xcresult \
            "$BUILD_RUN_REPORT_PATH" \
            "$BUNDLE_INSPECT_REPORT_PATH" \
            DDDAttendance-Stage.ipa

      # 기존 계약대로 앱 build는 필수지만 bundle inspect는 정보성으로 유지한다.
      - name: Fail if app build failed
        if: steps.app-build.outcome != 'success'
        run: exit 1

  # Maestro E2E가 로컬 Studio에서 안정화되면 별도 job으로 추가하고 pr-report.needs에 연결한다.
  pr-report:
    name: PR report
    if: always() && needs.build-test-shards.result != 'cancelled'
    needs: [build-test-shards, test-shards, bundle-insights]
    runs-on: self-hosted
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download test and coverage reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pr-test-*-${{ github.run_id }}*
          path: Artifacts/tests

      - name: Download bundle reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pr-bundle-insights-${{ github.run_id }}*
          path: Artifacts/bundle
          merge-multiple: true

      - name: Report to PR
        uses: actions/github-script@v7
        env:
          RESULT_BUNDLE_DIR: Artifacts/tests
          TEST_OUTCOME: ${{ needs.build-test-shards.result == 'success' && needs.test-shards.result == 'success' && 'success' || 'failure' }}
          TEST_RUN_REPORT_PATH: Artifacts/tests
          BUILD_RUN_REPORT_PATH: Artifacts/bundle/BuildRunReport.json
          BUNDLE_INSPECT_REPORT_PATH: Artifacts/bundle/BundleInspectReport.json
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/Scripts/ios-test-report.js`)
            await report({ github, context, core })

      - name: Fail if a required PR check failed
        if: needs.build-test-shards.result != 'success' || needs.test-shards.result != 'success' || needs.bundle-insights.result != 'success'
        run: exit 1
